services:
  zeyzar-cloud:
    build: .
    container_name: zeyzar-cloud
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OWNER_USERNAME: ${OWNER_USERNAME:?Set OWNER_USERNAME in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    env_file:
      - .env
